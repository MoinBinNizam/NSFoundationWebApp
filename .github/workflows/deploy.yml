name: Build and Deploy Production Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual deployment must build the exact approved release tag,
          # rather than whichever revision happens to be the default branch.
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nsfoundation-backend:${{ github.event.inputs.release_tag || github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nsfoundation-frontend:${{ github.event.inputs.release_tag || github.ref_name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on approved production host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd ${{ secrets.PRODUCTION_APP_DIR }}
            git fetch --tags origin
            git checkout ${{ github.event.inputs.release_tag || github.ref_name }}
            export BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/nsfoundation-backend:${{ github.event.inputs.release_tag || github.ref_name }}
            export FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/nsfoundation-frontend:${{ github.event.inputs.release_tag || github.ref_name }}
            chmod 700 scripts/deploy-production.sh
            ./scripts/deploy-production.sh
